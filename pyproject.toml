[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-orchestrator"
version = "0.1.0"
description = "Local-first web orchestrator for coordinating AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
vibe-orchestrator = "vibe_orchestrator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibe_orchestrator = ["templates/*.html", "static/*.js", "static/*.css"]
